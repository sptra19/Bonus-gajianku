
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIKET NONTON GRATIS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 24px;
      color: #172033;
    }
    main {
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #hasil {
      overflow-wrap: anywhere;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h2>TIKET NONTON GRATIS</h2>
    <p>
      KLAIM GRATIS UNTUK NONTON FILM TERBAIK
      sebelum masuk web konfirmasi lokasi terlebi dahulu
    </p>

    <button id="lokasi">aktifkan lokasi</button>
    <p id="hasil" aria-live="polite"></p>
  </main>

  <script>
    const tombol = document.getElementById("lokasi");
    const hasil = document.getElementById("hasil");

    tombol.addEventListener("click", () => {
      if (!navigator.geolocation) {
        hasil.textContent = "Browser tidak mendukung lokasi.";
        return;
      }

      hasil.textContent = "Meminta izin lokasi...";

      navigator.geolocation.getCurrentPosition(
        (posisi) => {
          hasil.textContent =
            "Izin diberikan. Latitude: " +
            posisi.coords.latitude +
            ", Longitude: " +
            posisi.coords.longitude;
        },
        () => {
          hasil.textContent =
            "Lokasi tidak tersedia atau izin ditolak.";
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    });
  </script>
</body>
</html>
