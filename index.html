<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonton gratis, dapat bonus koin setiap selesai menonton</title>
    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Nonton gratis di sini, klik sekarang sebelum hangus</h1>
        <p class="deskripsi">
            Halo, Nonton gratis di sini, bonus koin menanti setiap selesai menonton
        <p class="peringatan">
            <strong>Transparansi:</strong> Klik tombol di bawah, dapat 100 koin langsung! 1 koin senilai Rp1.000
        <button id="btn-lokasi">Dapatkan koin sekarang</button>
        <p id="status"></p>
    </div>

    <!-- Menghubungkan JavaScript sebagai module -->
    <script type="module" src="app.js"></script>
</body>
</html>
